# Pull requests run only checks and build (cheap); the heavier jobs run on pushes to main (GitHub Actions minutes are billed per job).
# Runs on every pull request and on every push to main. A red run means something that worked before no longer does.
#
#   checks             type check, lint (errors fail it, warnings do not), and the whole test suite (no database or cloud needed)
#   build              the production build, which catches what the type check cannot (route files, client/server mix-ups)
#   scan-generated     scans the generated Terraform, Dockerfiles and manifests with Trivy against security/scan-policy.json
#   terraform-validate generates Terraform for every verified Azure pattern and runs `terraform validate` on it
#   docker-samples     builds and runs the sample app of every Container Templates stack, and a compose stack with every companion service
#   databases          starts PostgreSQL, MySQL, MongoDB, Redis and RabbitMQ from the generated files (and the exact VM line), checks the password and that data survives
#   stack-project      builds and starts a Frontend + Backend + API + Database project together (as downloaded, and as an EC2 server runs it) and checks the parts are connected
#   server-software    runs the "Install on the server" script for every item in real Amazon Linux, Ubuntu and Debian containers
#
# To make a red run block merging: GitHub repository Settings, Branches, add a rule for main that requires these three checks.
name: ci

on:
  # Not on every push to every branch: a pull request is checked before it is merged, and main after. Open a pull request to get a run for a branch
  # (scripts/deploy.sh reads the result of that run for the commit it deploys).
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older, still-running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The type check and the production build outgrew Node's default heap on the runner ("JavaScript heap out of memory").
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --quiet
      - name: Tests
        run: npm test
      # Scores of every built-in template against the saved ones: a rule or default that lowers them shows up here, in the pull request that caused it.
      - name: Assessment trend
        run: npm run assessment:trend
      # The real download: fetches the pinned Terraform from HashiCorp, checks it against the checksum in the code and runs it.
      - name: Terraform downloads and verifies itself
        run: npx tsx --tsconfig tsconfig.json scripts/install-terraform.ts --managed

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build

  terraform-validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: npm ci
      - name: Validate the generated Azure Terraform
        env:
          TERRAFORM_BIN: terraform
        run: npx tsx --tsconfig tsconfig.json scripts/tf-validate-azure.ts "$RUNNER_TEMP/tf-validate"
      - name: Validate the generated AWS Terraform (Container service node)
        env:
          TERRAFORM_BIN: terraform
        run: npx tsx --tsconfig tsconfig.json scripts/tf-validate-aws.ts "$RUNNER_TEMP/tf-validate-aws"
      - name: Validate the generated container deployments (ECS, Container Apps, Kubernetes)
        env:
          TERRAFORM_BIN: terraform
        run: npx tsx --tsconfig tsconfig.json scripts/validate-containers.ts "$RUNNER_TEMP/validate-containers"

  # Scans the files CloudBuilder generates (Terraform, Dockerfiles, Kubernetes manifests) with Trivy, pinned by digest in security/trivy.json, and applies
  # security/scan-policy.json: a new serious finding, a known gap that grew, or a decision about something that is gone fails the run.
  scan-generated:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scan the generated files
        run: npx tsx --tsconfig tsconfig.json scripts/scan-generated.ts "$RUNNER_TEMP/scan"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            ${{ runner.temp }}/scan/scan-report.md
            ${{ runner.temp }}/scan/scan-findings.json
          if-no-files-found: ignore

  # Builds every stack's sample app with Docker, runs it and calls its health check; then starts one stack with every companion service and the HTTPS proxy.
  docker-samples:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and run every sample
        run: npx tsx --tsconfig tsconfig.json scripts/build-samples.ts "$RUNNER_TEMP/build-samples"

  server-software:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install every server software item in Amazon Linux 2023, Ubuntu and Debian
        run: npx tsx --tsconfig tsconfig.json scripts/verify-server-software.ts

  databases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start every database from the generated files and check it
        run: npx tsx --tsconfig tsconfig.json scripts/verify-databases.ts

  stack-project:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and start a combined project and check the parts are connected
        run: npx tsx --tsconfig tsconfig.json scripts/verify-stack-project.ts
